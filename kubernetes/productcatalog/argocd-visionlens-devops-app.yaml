apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: productcatalog
  namespace: argocd
spec:
  project: otel-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: otel-demo

  sources:
    - repoURL: https://github.com/robertteah/visionlens-devops-project-demo
      path: kubernetes/productcatalog
      targetRevision: main

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
